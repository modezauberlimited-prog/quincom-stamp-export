name: Sync stamp b64 from Vercel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-stamp-b64.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download b64 from Vercel
        run: |
          curl -fsSL "https://quincom-stamp-export.vercel.app/quincom-uae-stamp-from-generator.png.b64" \
            -o quincom-uae-stamp-from-generator.png.b64
          wc -c quincom-uae-stamp-from-generator.png.b64
          python3 - <<'PY'
          import pathlib, base64, hashlib
          c = pathlib.Path('quincom-uae-stamp-from-generator.png.b64').read_text().strip()
          assert c.startswith('iVBORw0KGgo')
          raw = base64.b64decode(c)
          assert len(raw) == 41684
          print(hashlib.sha256(raw).hexdigest())
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quincom-uae-stamp-from-generator.png.b64
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add Quincom stamp PNG as base64 text"
          git push
